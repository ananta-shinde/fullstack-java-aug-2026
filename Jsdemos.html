<script>
    apple = 30
    // create array
    const fruits = []  // declare an array variable

    // insert values into array
    fruits.push(20)
    fruits.push("Mango")
    fruits.push(apple)

    // update a value in an array
    fruits[0] = 40

    index = fruits.indexOf("Apple")
    if(index >= 0){
        fruits[index] = "banana"
    }


    // search a value into ana array
    console.log(fruits.includes("banana")) //  it returns boolean value
    console.log(fruits.indexOf(20)) // it retuns index , -1 if value not found

    console.log(fruits)

    // reading value from array based on position
    console.log(fruits[0])
    console.log(fruits[1])
    console.log(fruits[2])

    // travesing in array
    // for(intialization;condition;update)
    for(i=0 ;i<fruits.length ;i++ ){
        console.log(fruits[i])
    }


   
</script>
